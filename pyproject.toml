[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwtools-mcp"
version = "0.2.0"
description = "MCP server providing IPv4 subnet and address calculation tools"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/crims0n/nwtools-mcp"
Repository = "https://github.com/crims0n/nwtools-mcp"
Issues = "https://github.com/crims0n/nwtools-mcp/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
nwtools-mcp = "nwtools_mcp.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nwtools_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/Dockerfile",
    "/pyproject.toml",
    "/app.py",
    "/main.py",
    "/server.py",
    "/tools.py",
]
