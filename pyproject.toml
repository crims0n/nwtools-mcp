[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwtools-mcp"
version = "0.1.0"
description = "MCP server providing IPv4 subnet and address calculation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
nwtools-mcp = "nwtools_mcp.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nwtools_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/Dockerfile",
    "/pyproject.toml",
    "/app.py",
    "/main.py",
    "/server.py",
    "/tools.py",
]
